[project]
name = "simple-redstone"
version = "0.1.0"
description = "A simple, pure ASCII format to encode Minecraft redstone structures"
readme = "README.md"
authors = [
    { name = "MqCreaple", email = "gmq14159@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "minecraft-data>=3.20.0",
    "nucleation>=0.10.24",
    "numpy>=2.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
simple-redstone = "simple_redstone:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
